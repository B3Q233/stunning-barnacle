# config.yaml 模板
# 来源标注图例：
#   [paper]       论文明确写出，直接使用论文值
#   [ai]          论文未给出但可推断，注释中说明推断依据
#   [unreported]  论文完全未提及，使用社区/框架默认值
# 严禁将 [ai] / [unreported] 的值标注为 [paper]

data:
  raw_data_path: "data/raw/dataset_name"        # [unreported] 用户本地路径，需用户手动下载后填写
  processed_data_path: "data/processed"          # [unreported] 由①数据处理脚本生成
  train_val_test_split: [0.8, 0.1, 0.1]           # [paper] 见论文 Table X
  negative_sampling_ratio: 4                      # [ai] 论文未给出，推断依据：同领域常见设置

model:
  embedding_dim: 64                               # [paper] 见论文 4.2 节
  n_layers: 3                                     # [paper] 见论文 Figure 2
  dropout: 0.1                                    # [unreported] 框架默认值

training:
  batch_size: 1024                                # [paper] 见论文 Table 3
  epochs: 100                                      # [paper]
  optimizer: "adam"                                # [paper]，可选值仅限 adam/sgd（train_step 仅实现这两种分支）
  lr: 0.001                                        # [paper]
  weight_decay: 0.0                                # [unreported]
  device: "cuda"                                   # [unreported]，可选 cuda/cpu，自动回退见框架代码

evaluation:
  metrics: ["recall@20", "ndcg@20"]                # [paper] 见论文 Table 4
  eval_negative_sampling: "full_ranking"           # [ai] 论文描述模糊，推断依据：常见做法是全量排序而非采样
  filter_seen_items: true                          # [paper]
