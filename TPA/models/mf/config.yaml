data:
  dataset: ml100k
run_tag: null                    # 实验标签（--tag 或此处指定；null=自动当前时间 2026-08-07-14:20）
evaluation:
  k: 20                         # 回退评估 K（仅当 metrics 中无 @K 时使用）
  eval_every: 1                 # [ai] 全量评估间隔(epoch)
  metrics:
  - recall@{k}: upper           # upper=越高越好 / lower=越低越好；K 由 evaluation.k 绑定
  - ndcg@{k}: upper
  checkpoint_mode: per_metric   # per_metric=每个指标各存一份最优（默认）| single=仅第一指标
model:
  emb_dim: 64
  init_method: normal            # 嵌入初始化方式（与 LightGCN 默认一致: N(0,0.1)）
training:
  batch_size: 256
  checkpoint_dir: models/mf/outputs/checkpoints
  device: cuda
  epochs: 100
  lr: 0.001
  save_every_n_epochs: 10
  neg_ratio: 1
  shuffle: true
  weight_decay: 0.0001
  num_workers: 4                # DataLoader 子进程数（0=主进程串行）
  persistent_workers: true      # 跨 epoch 复用 worker（需 num_workers>0）
