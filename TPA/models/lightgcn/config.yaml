data:
  dataset: gowalla
evaluation:
  k: 20
  eval_every: 10              # [ai] 全量评估间隔(epoch)，10=每10个epoch计算recall/ndcg
  metrics:
  - recall@20
  - ndcg@20
model:
  emb_dim: 64
  n_layers: 3
training:
  batch_size: 1024
  checkpoint_dir: models/lightgcn/outputs/checkpoints
  device: cuda
  epochs: 1000
  lr: 0.001
  save_every_n_epochs: 100
  shuffle: true
  weight_decay: 0.0001
