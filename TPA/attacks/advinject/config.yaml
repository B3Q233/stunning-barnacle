# AdvInject 代理模型投毒复现配置（canonical）
# 数值来源：上游 revisit_adv_rec/generate_attack_args.py；未报告项标为 [unreported]
dataset: ml100k
mode: all
seed: 1
k: 50                            # 顶层评估 K（原 evaluation.k）
run_tag: null

model:
  name: wmf                      # victim model；通过 models/registry.py 解析

classification:
  percentile_head: 95            # 头部区间上界（交互数百分位）
  percentile_upper_torso: 75     # 上躯干区间上界
  percentile_lower_torso: 50     # 下躯干/尾部交界

surrogate:
  name: itemae                   # [upstream] Sur-ItemAE；可选 wmf_sgd / wmf_als
  training:
    epochs: 50                   # [upstream]
    lr: 0.001                    # [upstream]
    weight_decay: 1e-6           # [upstream] 原 surrogate.l2
    batch_size: 2048             # [upstream]
    hidden_dims: [256, 128]      # [upstream]
    weight_alpha: 20.0           # [upstream] ItemAE recon / WMF confidence
    unroll_steps: 5              # [upstream] 原 attack.unroll_steps

attack:
  ratio: 0.01                    # [upstream] 假用户比例（0<值≤1 表示比例）
  target_items:
    count: 5                     # 目标物品数
    zone: head                   # head|upper_torso|lower_torso|tail
  adv:
    attack_type: adversarial     # [upstream] adversarial / random
    epochs: 30                   # 对抗训练轮数
    lr: 1.0                      # 对抗学习率
    momentum: 0.95               # 对抗动量
    proj_threshold: 0.1
    click_targets: false

training:
  epochs: 15                     # victim [unreported in attack generator]
  batch_size: 256                # victim [unreported in attack generator]
  lr: 0.001                      # victim [unreported in attack generator]
  weight_decay: 1e-5             # victim [unreported in attack generator]
  device: cpu                    # 设备（cpu|cuda|cuda:N）

evaluation:
  report_model_utility: true

output:
  dir: attacks/advinject/outputs # 原顶层 output_dir
