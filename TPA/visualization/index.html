<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPA 实验数据可视化</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/echarts.min.js?v=3"></script>
</head>
<body>
  <header>
    <div class="toolbar">
      <input id="title-input" class="title-input" value="TPA 实验数据可视化">
      <button id="btn-import">导入数据</button>
      <input id="file-input" type="file" webkitdirectory multiple hidden>
      <button id="btn-export">导出图片</button>
      <button id="btn-export-snapshot">导出快照</button>
      <button id="btn-load-snapshot">导入快照</button>
      <button id="btn-clear">清空</button>
      <input id="snapshot-input" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="drop-zone" class="drop-zone">拖拽实验文件夹或文件到此处导入</div>
  </header>

  <main class="layout">
    <aside class="panel">
      <h2>实验列表（勾选显示）</h2>
      <ul id="experiment-list"></ul>
    </aside>
    <section class="panel chart-panel">
      <div class="chart-controls">
        <label>图表类型
          <select id="chart-type">
            <option value="line">折线图</option>
            <option value="bar">直方图</option>
            <option value="compare">对比图（Clean vs Poisoned）</option>
          </select>
        </label>
        <label>指标
          <select id="metric-select"></select>
        </label>
        <span id="chart-hint" class="hint"></span>
      </div>
      <div id="chart" class="chart"></div>
    </section>
  </main>

  <div id="message" class="message"></div>

  <div id="epoch-dialog" class="dialog hidden">
    <div class="dialog-box">
      <h3 id="epoch-dialog-title">编辑数据点</h3>
      <div class="epoch-tools">
        <button id="epoch-select-all" type="button">全选</button>
        <button id="epoch-clear" type="button">清空</button>
        <label>区间
          <input id="epoch-from" type="number" min="1" placeholder="起始 epoch">
          ~
          <input id="epoch-to" type="number" min="1" placeholder="结束 epoch">
          <button id="epoch-apply-range" type="button">应用区间</button>
        </label>
      </div>
      <div id="epoch-list" class="epoch-list"></div>
      <div class="dialog-actions">
        <button id="epoch-ok" type="button">确定</button>
        <button id="epoch-cancel" type="button">取消</button>
      </div>
    </div>
  </div>

  <script src="js/parser.js?v=3"></script>
  <script src="js/transforms.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
